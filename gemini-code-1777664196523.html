<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LineLock Titan 3.0 | The Full Machine</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <style>
        :root { --indigo: #6366f1; --red: #ef4444; --emerald: #10b981; }
        body { -webkit-tap-highlight-color: transparent; scroll-behavior: smooth; }
        .is-user-line { border-left: 6px solid var(--indigo); background: white; border-radius: 0 20px 20px 0; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); }
        .ghost-text { transition: all 0.25s ease; cursor: pointer; }
        .chaos-flash { pointer-events: none; position: fixed; inset: 0; z-index: 100; opacity: 0; transition: opacity 0.1s; }
        .beat-divider { position: relative; margin: 4rem 0; text-align: center; }
        .beat-divider::before { content: ''; position: absolute; top: 50%; left: 0; right: 0; border-top: 2px dashed #e2e8f0; z-index: -1; }
        .heatmap-cell { transition: background-color 1s ease; }
        .loader-ring { border: 4px solid #f3f3f3; border-top: 4px solid var(--indigo); border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        input[type="range"] { accent-color: var(--indigo); }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 font-sans min-h-screen pb-64 selection:bg-indigo-100">

    <div id="chaos-overlay" class="chaos-flash"></div>

    <header class="bg-white/90 backdrop-blur-xl border-b sticky top-0 z-50 shadow-sm">
        <div class="max-w-5xl mx-auto p-4 space-y-4">
            <div class="flex justify-between items-center">
                <div class="flex flex-col">
                    <h1 class="text-2xl font-black italic tracking-tighter text-indigo-600 leading-none">LINELOCK TITAN 3.0</h1>
                    <span id="status-tag" class="text-[9px] font-black text-slate-400 mt-1 uppercase tracking-widest">System Ready</span>
                </div>
                <div class="flex gap-2">
                    <button id="voice-master-btn" onclick="toggleVoiceMode()" class="bg-slate-900 text-white px-6 py-2 rounded-2xl text-xs font-black shadow-lg active:scale-95 transition-all">VOICE: OFF</button>
                    <button onclick="toggleDashboard()" class="bg-slate-100 text-slate-600 px-4 py-2 rounded-2xl text-xs font-bold">ANALYTICS</button>
                </div>
            </div>

            <div id="main-console" class="hidden grid grid-cols-1 md:grid-cols-3 gap-6 bg-slate-50 p-5 rounded-[2rem] border border-slate-200">
                <div class="space-y-4">
                    <div class="flex justify-between items-center bg-white px-3 py-1.5 rounded-full border">
                        <span class="text-[9px] font-black text-slate-400 uppercase">View Mode</span>
                        <select id="v-mode" onchange="AppState.viewMode = this.value; render();" class="text-xs font-bold bg-transparent outline-none">
                            <option value="full">FULL TEXT</option>
                            <option value="mnemonic">1ST LETTER</option>
                        </select>
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div class="space-y-1">
                            <label class="text-[8px] font-black text-slate-400 uppercase">Ghosting</label>
                            <input type="range" id="g-slider" min="0" max="100" value="100" oninput="render()" class="w-full h-1">
                        </div>
                        <div class="space-y-1">
                            <label class="text-[8px] font-black text-slate-400 uppercase">Blanks</label>
                            <input type="range" id="b-slider" min="0" max="80" value="0" oninput="render()" class="w-full h-1">
                        </div>
                    </div>
                </div>

                <div class="space-y-4">
                    <div class="flex justify-between items-center bg-white px-3 py-1.5 rounded-full border">
                        <span class="text-[9px] font-black text-slate-400 uppercase">Emotion</span>
                        <select id="v-intention" class="text-xs font-bold bg-transparent outline-none">
                            <option value="neutral">NEUTRAL</option>
                            <option value="aggressive">AGGRESSIVE</option>
                            <option value="sarcastic">SARCASTIC</option>
                            <option value="vulnerable">VULNERABLE</option>
                        </select>
                    </div>
                    <div class="flex gap-2">
                        <select id="t-mode" class="flex-1 text-[9px] bg-white border rounded-xl px-2 py-2 font-black uppercase">
                            <option value="time">AUTO-TIMER</option>
                            <option value="tap">TAP TO NEXT</option>
                        </select>
                        <div class="flex items-center gap-2 bg-white px-2 rounded-xl border">
                            <label class="text-[8px] font-black uppercase">Whisper</label>
                            <input type="checkbox" id="whisper-toggle" checked>
                        </div>
                    </div>
                </div>

                <div class="space-y-4">
                    <div class="flex justify-between items-center bg-white px-3 py-1.5 rounded-full border">
                        <span class="text-[9px] font-black text-slate-400 uppercase">Training</span>
                        <div class="flex gap-2">
                            <button onclick="setTrain('ladder')" id="lad-btn" class="text-[9px] font-bold">LADDER</button>
                            <button onclick="setTrain('reverse')" id="rev-btn" class="text-[9px] font-bold">REVERSE</button>
                        </div>
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div class="space-y-1">
                            <label class="text-[8px] font-black text-slate-400 uppercase">Font Size</label>
                            <input type="range" id="s-slider" min="14" max="32" value="20" oninput="render()" class="w-full h-1">
                        </div>
                        <div class="space-y-1">
                            <label class="text-[8px] font-black text-slate-400 uppercase">Scroll Speed</label>
                            <input type="range" id="scroll-slider" min="0" max="100" value="0" oninput="handleScrollChange()" class="w-full h-1">
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <main class="max-w-5xl mx-auto p-4">
        <section id="view-upload" class="mt-20 max-w-xl mx-auto text-center space-y-8">
            <div class="bg-white p-12 rounded-[3rem] shadow-2xl border-4 border-dashed border-slate-100 relative group transition-all hover:border-indigo-200">
                <input type="file" id="pdf-input" accept=".pdf" class="hidden" onchange="handlePDF(event)">
                <label for="pdf-input" class="cursor-pointer block">
                    <div class="w-24 h-24 bg-indigo-50 rounded-full flex items-center justify-center mx-auto mb-6 group-hover:scale-110 transition-transform">
                        <svg class="w-10 h-10 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                    </div>
                    <h2 class="text-2xl font-black text-slate-800">Drop PDF Script</h2>
                    <p class="text-slate-400 mt-2 font-medium">Titan 3.0 will aggressively clean and parse</p>
                </label>

                <div id="pdf-loader" class="hidden mt-8 flex flex-col items-center">
                    <div class="loader-ring mb-4"></div>
                    <div class="w-full bg-slate-100 h-2 rounded-full overflow-hidden">
                        <div id="pdf-progress" class="bg-indigo-600 h-full w-0 transition-all duration-300"></div>
                    </div>
                </div>
            </div>
            <button onclick="togglePaste()" class="text-[10px] font-black text-slate-400 uppercase tracking-widest hover:text-indigo-600">Or Paste Raw Text</button>
        </section>

        <section id="view-paste" class="hidden mt-12 max-w-2xl mx-auto">
            <textarea id="paste-input" rows="12" class="w-full p-8 rounded-[2rem] border-0 shadow-inner bg-white text-lg focus:ring-2 focus:ring-indigo-500" placeholder="Paste script text here..."></textarea>
            <button onclick="importRaw(document.getElementById('paste-input').value)" class="w-full mt-4 bg-slate-900 text-white py-5 rounded-2xl font-black">PROCESS MANUALLY</button>
        </section>

        <section id="view-char" class="hidden mt-20 text-center">
            <h2 class="text-xs font-black text-slate-400 uppercase tracking-[0.5em] mb-12">Who are you playing?</h2>
            <div id="char-grid" class="flex flex-wrap justify-center gap-4"></div>
        </section>

        <section id="view-work" class="hidden mt-8">
            <div id="beat-tabs" class="flex gap-2 overflow-x-auto no-scrollbar pb-6 sticky top-[300px] z-30"></div>
            <div id="script-display" class="space-y-4 pb-96"></div>
        </section>
    </main>

    <nav id="action-dock" class="hidden fixed bottom-10 left-1/2 -translate-x-1/2 bg-white/90 backdrop-blur-2xl border shadow-[0_30px_60px_-15px_rgba(0,0,0,0.3)] rounded-[2.5rem] px-10 py-6 z-50 flex items-center gap-10">
        <button onclick="toggleSlashMode()" id="slash-btn" class="text-slate-300 hover:text-red-500 transition-colors">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M7 20l4-16m2 16l4-16" stroke-width="2.5" stroke-linecap="round"/></svg>
        </button>
        <div class="h-8 w-[1px] bg-slate-200"></div>
        <button onclick="togglePunc()" id="punc-btn" class="text-[10px] font-black text-slate-400">PUNC</button>
        <div class="flex items-center gap-3">
            <label class="text-[10px] font-black text-red-500 uppercase">Chaos</label>
            <input type="checkbox" id="chaos-toggle" onchange="toggleChaos()" class="w-5 h-5 accent-red-500">
        </div>
    </nav>

    <div id="dash-modal" class="hidden fixed inset-0 bg-white z-[100] p-10 overflow-y-auto">
        <div class="max-w-2xl mx-auto space-y-12">
            <div class="flex justify-between items-center">
                <h2 class="text-5xl font-black italic tracking-tighter">INSIGHTS</h2>
                <button onclick="toggleDashboard()" class="text-slate-300 hover:text-black font-black text-sm">CLOSE</button>
            </div>
            <div class="grid grid-cols-2 gap-8">
                <div class="bg-indigo-50 p-12 rounded-[3rem] text-center border border-indigo-100">
                    <p class="text-[10px] font-black text-indigo-400 uppercase mb-3">Confidence</p>
                    <h3 id="stat-conf" class="text-7xl font-black text-indigo-700">0%</h3>
                </div>
                <div class="bg-red-50 p-12 rounded-[3rem] text-center border border-red-100">
                    <p class="text-[10px] font-black text-red-400 uppercase mb-3">Peeks</p>
                    <h3 id="stat-peeks" class="text-7xl font-black text-red-700">0</h3>
                </div>
            </div>
            <button onclick="runDrill()" class="w-full bg-slate-900 text-white py-8 rounded-3xl font-black tracking-widest active:scale-95 transition-transform shadow-2xl">START TROUBLE SPOT DRILL</button>
        </div>
    </div>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        let AppState = {
            raw: "", lines: [], user: "", viewMode: 'full', trainMode: 'standard', 
            step: 1, voice: false, chaos: false, slash: false, punc: true, 
            beats: new Set(), activeBeat: null, stats: {}, format: 'screenplay', scrollInterval: null
        };

        // --- 1. PERSISTENCE ENGINE ---
        const save = () => {
            const data = {...AppState, beats: Array.from(AppState.beats)};
            localStorage.setItem("LINELOCK_TITAN_PRO", JSON.stringify(data));
        };
        const load = () => {
            const data = localStorage.getItem("LINELOCK_TITAN_PRO");
            if(data) {
                const parsed = JSON.parse(data);
                AppState = {...parsed, beats: new Set(parsed.beats)};
                if(AppState.raw) hydrate();
            }
        };

        // --- 2. AGGRESSIVE PDF & TEXT PARSER ---
        async function handlePDF(e) {
            const file = e.target.files[0];
            if(!file) return;
            
            document.getElementById('pdf-loader').classList.remove('hidden');
            const reader = new FileReader();
            reader.onload = async function() {
                const typedarray = new Uint8Array(this.result);
                const pdf = await pdfjsLib.getDocument(typedarray).promise;
                let fullText = "";
                for(let i = 1; i <= pdf.numPages; i++){
                    const page = await pdf.getPage(i);
                    const content = await page.getTextContent();
                    fullText += content.items.map(item => item.str).join(" ") + "\n";
                    document.getElementById('pdf-progress').style.width = (i/pdf.numPages*100) + "%";
                }
                importRaw(fullText);
            };
            reader.readAsArrayBuffer(file);
        }

        function importRaw(text) {
            // Aggressive cleaning pass
            AppState.raw = text.split('\n')
                .map(l => l.trim())
                .filter(l => !l.match(/^(\d+|Page \d+|[A-Z\s]+ \d{1,2}\/\d{2}\/\d{2,4}|\*|CONTINUED)/i))
                .filter(l => l.length > 0)
                .join('\n');
            
            // Detect Screenplay vs Stageplay
            AppState.format = (AppState.raw.slice(0,1000).match(/[A-Z\s]+:/)) ? 'stage' : 'screen';
            
            document.getElementById('view-upload').classList.add('hidden');
            document.getElementById('view-paste').classList.add('hidden');
            showCharacterSelect();
            save();
        }

        function showCharacterSelect() {
            document.getElementById('view-char').classList.remove('hidden');
            // Advanced Name Matching
            const regex = AppState.format === 'stage' ? /^[A-Z\s]{2,}(?=:)/gm : /^[A-Z\s]{2,}(?=\n|$)/gm;
            const chars = [...new Set(AppState.raw.match(regex))].map(c => c.trim());
            
            document.getElementById('char-grid').innerHTML = chars.map(c => `
                <button onclick="setRole('${c}')" class="px-10 py-5 bg-white border-2 rounded-[2rem] font-black text-slate-700 hover:border-indigo-600 transition active:scale-95 shadow-sm">${c}</button>
            `).join('');
        }

        function setRole(c) { AppState.user = c; hydrate(); }

        function hydrate() {
            document.getElementById('view-upload').classList.add('hidden');
            document.getElementById('view-char').classList.add('hidden');
            document.getElementById('view-work').classList.remove('hidden');
            document.getElementById('main-console').classList.remove('hidden');
            document.getElementById('action-dock').classList.remove('hidden');
            render();
        }

        // --- 3. THE TITAN RENDERER (ALL FEATURES INTEGRATED) ---
        function render() {
            const container = document.getElementById('script-display');
            const lines = AppState.raw.split('\n');
            container.innerHTML = '';
            
            let curChar = "";
            let curBeat = 0;
            const g = document.getElementById('g-slider').value / 100;
            const b = document.getElementById('b-slider').value;
            const sz = document.getElementById('s-slider').value;

            lines.forEach((line, idx) => {
                const trimmed = line.trim();
                const type = getLineType(line, trimmed);
                if(type === 'char') curChar = trimmed.replace(':','').trim();
                if(AppState.beats.has(idx)) curBeat++;

                // Logic Filters
                if(AppState.activeBeat !== null && curBeat !== AppState.activeBeat) return;
                if(AppState.trainMode === 'ladder' && idx > AppState.step) return;
                if(AppState.trainMode === 'reverse' && idx < (lines.length - AppState.step)) return;

                if(AppState.beats.has(idx)) {
                    container.innerHTML += `<div class="beat-divider"><span class="bg-slate-50 px-6 text-[10px] font-black text-red-400 tracking-[0.5em]">BEAT ${curBeat+1}</span></div>`;
                }

                const isU = (curChar === AppState.user);
                const div = document.createElement('div');
                div.id = `line-${idx}`;
                div.className = `heatmap-cell p-5 transition-all duration-300 ${isU ? 'is-user-line my-4' : 'opacity-40 text-sm'} ${AppState.slash ? 'cursor-crosshair border-2 border-dashed border-red-200' : ''}`;
                div.style.fontSize = sz + 'px';
                div.onclick = () => handleInteraction(idx);

                // Heatmap Score
                const st = AppState.stats[idx] || {p:0, s:0};
                if(st.s > 50) div.style.backgroundColor = `rgba(16, 185, 129, 0.08)`;
                if(st.p > 3) div.style.backgroundColor = `rgba(239, 68, 68, 0.08)`;

                if(type === 'char') {
                    div.innerHTML = `<span class="text-[10px] font-black text-indigo-500 uppercase tracking-widest">${curChar}</span>`;
                } else if(type === 'dir') {
                    div.innerHTML = `<span class="italic text-slate-400 opacity-60 text-xs">${trimmed}</span>`;
                } else {
                    let txt = trimmed;
                    if(!AppState.punc) txt = txt.replace(/[^\w\s]|_/g, "");
                    if(isU && b > 0) txt = txt.split(' ').map(w => Math.random()*100 < b ? '_____' : w).join(' ');
                    if(isU && AppState.viewMode === 'mnemonic') txt = txt.split(' ').map(w => w[0] ? w[0] + (w.match(/[.,!?;:]+$/) || '') : '').join(' ');
                    
                    div.innerHTML = `<span class="ghost-text block" style="opacity:${isU ? g : 1}">${txt}</span>`;
                }
                container.appendChild(div);
            });
            updateBeatTabs();
        }

        // --- 4. SOLO PARTNER & EMOTION ENGINE ---
        const synth = window.speechSynthesis;
        const EmotionMap = {
            neutral: {r:1, p:1, v:1}, aggressive: {r:1.4, p:0.8, v:1}, 
            sarcastic: {r:0.8, p:0.7, v:0.9}, vulnerable: {r:0.7, p:1.2, v:0.6}
        };

        async function toggleVoiceMode() {
            AppState.voice = !AppState.voice;
            document.getElementById('voice-master-btn').innerText = AppState.voice ? "VOICE: ON" : "VOICE: OFF";
            document.getElementById('voice-master-btn').classList.toggle('bg-red-600', AppState.voice);
            if(AppState.voice) rehearsalLoop(); else synth.cancel();
        }

        async function rehearsalLoop() {
            const lines = AppState.raw.split('\n').filter(l => l.trim());
            const trigger = document.getElementById('t-mode').value;
            const config = EmotionMap[document.getElementById('v-intention').value];
            
            for(let i = 0; i < lines.length; i++) {
                if(!AppState.voice) break;
                const isU = lines[i].includes(AppState.user);
                
                if(!isU) {
                    await new Promise(res => {
                        const ut = new SpeechSynthesisUtterance(lines[i]);
                        ut.rate = config.r; ut.pitch = config.p; ut.onend = res;
                        synth.speak(ut);
                    });
                } else {
                    // Whisper Prompter
                    let done = false;
                    if(document.getElementById('whisper-toggle').checked) {
                        setTimeout(() => {
                            if(!done && AppState.voice) {
                                const hint = new SpeechSynthesisUtterance(lines[i].split(' ').slice(0,3).join(' '));
                                hint.volume = 0.3; hint.pitch = 1.3; synth.speak(hint);
                            }
                        }, 5000);
                    }
                    if(trigger === 'time') await new Promise(res => setTimeout(res, (lines[i].length * 60) + 2000));
                    else await new Promise(res => window.addEventListener('click', res, {once:true}));
                    done = true;
                }
            }
        }

        // --- 5. INTERACTION LOGIC ---
        function handleInteraction(idx) {
            if(AppState.slash) {
                AppState.beats.has(idx) ? AppState.beats.delete(idx) : AppState.beats.add(idx);
                render(); save(); return;
            }
            // PEEK LOGIC
            const st = AppState.stats[idx] || {p:0, s:0};
            st.p++; st.s = Math.max(0, st.s - 20);
            AppState.stats[idx] = st;
            
            const lineEl = document.getElementById(`line-${idx}`);
            const textEl = lineEl.querySelector('.ghost-text');
            if(!textEl) return;
            const original = AppState.raw.split('\n').filter(l=>l.trim())[idx];
            const cur = textEl.innerText;
            textEl.innerText = original; textEl.style.opacity = 1;
            setTimeout(() => { textEl.innerText = cur; textEl.style.opacity = document.getElementById('g-slider').value/100; render(); }, 1800);
            save();
        }

        // --- 6. UTILS & UI ---
        function getLineType(l, t) {
            if(AppState.format === 'stage' && t.match(/^[A-Z\s]+:/)) return 'char';
            if(AppState.format === 'screen' && t === t.toUpperCase() && !t.match(/[.!?]/)) return 'char';
            return (t.startsWith('(') || t.startsWith('[')) ? 'dir' : 'dialogue';
        }

        function handleScrollChange() {
            const val = document.getElementById('scroll-slider').value;
            clearInterval(AppState.scrollInterval);
            if(val > 0) {
                AppState.scrollInterval = setInterval(() => window.scrollBy(0, val / 10), 30);
            }
        }

        function toggleChaos() {
            const overlay = document.getElementById('chaos-overlay');
            if(document.getElementById('chaos-toggle').checked) {
                AppState.chaosTimer = setInterval(() => {
                    overlay.style.opacity = "0.2";
                    overlay.style.backgroundColor = `hsl(${Math.random()*360}, 100%, 50%)`;
                    setTimeout(() => overlay.style.opacity = "0", 150);
                }, 1500);
            } else clearInterval(AppState.chaosTimer);
        }

        function updateBeatTabs() {
            const nav = document.getElementById('beat-tabs');
            if(AppState.beats.size === 0) return nav.innerHTML = "";
            const markers = [0, ...Array.from(AppState.beats).sort((a,b)=>a-b)];
            nav.innerHTML = `<button onclick="setBeat(null)" class="px-6 py-2 rounded-full text-[10px] font-black flex-shrink-0 ${AppState.activeBeat === null ? 'bg-indigo-600 text-white shadow-xl' : 'bg-white border text-slate-400'}">FULL SCRIPT</button>`;
            markers.forEach((_, i) => {
                nav.innerHTML += `<button onclick="setBeat(${i})" class="px-6 py-2 rounded-full text-[10px] font-black flex-shrink-0 ${AppState.activeBeat === i ? 'bg-red-600 text-white shadow-xl' : 'bg-white border text-slate-400'}">BEAT ${i+1}</button>`;
            });
        }

        function setBeat(i) { AppState.activeBeat = i; render(); }
        function setTrain(m) { AppState.trainMode = (AppState.trainMode === m) ? 'standard' : m; AppState.step = 1; render(); }
        function togglePunc() { AppState.punc = !AppState.punc; render(); }
        function toggleSlashMode() { AppState.slash = !AppState.slash; document.getElementById('slash-btn').classList.toggle('text-red-500', AppState.slash); render(); }
        function toggleDashboard() { 
            document.getElementById('dash-modal').classList.toggle('hidden'); 
            const peeks = Object.values(AppState.stats).reduce((a,b)=>a+b.p, 0);
            document.getElementById('stat-peeks').innerText = peeks;
            const scores = Object.values(AppState.stats).map(s=>s.s);
            document.getElementById('stat-conf').innerText = scores.length ? Math.round(scores.reduce((a,b)=>a+b)/scores.length) + "%" : "0%";
        }
        function togglePaste() { 
            document.getElementById('view-upload').classList.add('hidden'); 
            document.getElementById('view-paste').classList.remove('hidden'); 
        }

        window.onload = load;
    </script>
</body>
</html>
